<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faboolux Materials Extractor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --orange:#e8541e; --green:#10b981; --ink:#e5e7eb; --muted:#8b93a7; --line:#26272e; --dot:#9aa0ad; }
  * { box-sizing:border-box; }
  body { margin:0; background:#000; color:var(--ink); font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .shell { max-width:1280px; margin:14px auto; background:#131419; border:1px solid #1d1e24; border-radius:30px; padding:40px; }
  header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .tag { display:inline-block; padding:6px 16px; border:1px solid var(--green); color:var(--green); background:rgba(16,185,129,.08); border-radius:999px; font-size:11.5px; font-weight:600; letter-spacing:.09em; }
  h1 { margin:12px 0 0; font-size:30px; font-weight:700; color:#fff; letter-spacing:-.01em; }
  .head-right { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .sync { margin-top:10px; font-size:12px; color:var(--muted); display:flex; gap:10px; align-items:center; }
  .linkbtn { background:none; border:0; color:var(--green); cursor:pointer; font:inherit; padding:0; text-decoration:underline; }
  button { font-family:inherit; cursor:pointer; }
  .btn-white { background:#fff; color:#111; border:0; border-radius:10px; padding:11px 20px; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:8px; }
  .btn-dark { background:#1f2026; color:var(--ink); border:1px solid #2c2d35; border-radius:10px; padding:11px 18px; font-size:14px; font-weight:500; }
  [hidden] { display:none !important; }

  #drop { margin-top:28px; border:2px dashed #2c2d35; border-radius:18px; padding:54px 20px; text-align:center; color:var(--muted); cursor:pointer; transition:.15s; }
  #drop.over, #drop:hover { border-color:var(--orange); background:rgba(232,84,30,.05); }
  #drop strong { color:#fff; font-size:17px; font-weight:600; }
  #drop p { margin:8px 0 0; font-size:13px; }
  #status { margin:18px 0 0; font-size:13.5px; color:var(--muted); min-height:18px; }
  #status.err { color:#f87171; font-weight:600; }

  .room { margin-top:30px; background:#17181d; border:1px solid var(--line); border-radius:20px; overflow:hidden; }
  .room-head { background:#0f1014; color:var(--orange); font-weight:700; font-size:17px; padding:18px 22px; border-bottom:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  thead { display:table-header-group; }
  th { text-align:left; color:var(--muted); font-size:12px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; padding:15px 18px; border-bottom:1px solid var(--line); }
  td { padding:18px; vertical-align:top; font-size:14px; border-bottom:1px solid var(--line); word-wrap:break-word; }
  tr:last-child td { border-bottom:0; }
  tr { break-inside:avoid; page-break-inside:avoid; }
  td.prod { font-weight:700; color:#fff; }
  .c-prod { width:15%; } .c-mat { width:11%; } .c-fin { width:31.5%; }

  .fin { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .fin-text { flex:1; min-width:0; }
  .fin-name { font-size:14px; line-height:1.35; }
  .fin-name b { font-weight:700; color:#fff; }
  .fin-name.fill { display:inline-block; background:#d93025; color:#fff; font-weight:700; padding:3px 9px; border-radius:6px; }
  .fin-code { font-size:12px; font-weight:600; margin-top:8px; color:#f3f4f6; }
  .fin-edge { font-size:12px; margin-top:8px; color:var(--muted); }
  .sw { flex:none; width:72px; height:72px; border-radius:10px; border:1.5px dotted var(--dot); object-fit:cover; display:block; background:transparent; }

  .actions { display:flex; gap:12px; justify-content:center; padding:22px; border-top:1px solid var(--line); }
  .btn-pill { background:#fff; color:#111; border:0; border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; }
  .btn-done { background:var(--green); color:#fff; border:0; border-radius:10px; padding:10px 20px; font-size:13px; font-weight:600; }
  .btn-del { display:block; margin-top:10px; background:#ef4444; color:#fff; border:0; border-radius:6px; padding:4px 10px; font-size:11px; font-weight:600; }
  .inp { width:100%; background:#222328; color:var(--ink); border:1.5px dashed rgba(232,84,30,.9); border-radius:8px; padding:10px 11px; font:inherit; font-size:14px; outline:none; }
  .inp:focus { border-style:solid; }
  .inp.b { font-weight:700; color:#fff; }
  .imgbox { flex:none; position:relative; width:72px; height:72px; border:1.5px dashed #3d3e47; border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--orange); font-size:12px; font-weight:600; cursor:pointer; overflow:hidden; }
  .imgbox:hover { border-color:var(--orange); }
  .imgbox img { width:100%; height:100%; object-fit:cover; }
  .imgbox .rm { position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; background:rgba(0,0,0,.7); color:#fff; font-size:11px; line-height:18px; text-align:center; }

  /* ---------- PDF / print: A4 landscape, one room per page ---------- */
  @page { size: A4 landscape; margin: 10mm; }
  @media print {
    html, body { background:#fff !important; color:#000 !important; }
    .shell { max-width:none; margin:0; padding:0; background:#fff; border:0; border-radius:0; }
    .no-print, header, #drop, #status, .sync { display:none !important; }
    .room { margin:0; background:#fff; border:1px solid #000; border-radius:12px; page-break-after:always; break-after:page; }
    .room:last-of-type { page-break-after:auto; break-after:auto; }
    .room-head { background:#fff; color:#000; font-size:17pt; padding:12px 16px 10px; border-bottom:0; }
    table { border-top:1px solid #000; }
    th { background:#eef3fa; color:#000; font-size:9pt; border:1px solid #000; padding:9px 10px; }
    td { color:#000; font-size:10pt; border:1px solid #000; padding:9px 10px; }
    td.prod { color:#000; }
    .fin-name b { color:#000; }
    .fin-code { color:#000; font-size:8.5pt; }
    .fin-edge { color:#222; font-size:8.5pt; }
    .sw { border:1.5px dotted #000; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="no-print">
    <div>
      <span class="tag">MATERIALS DATA</span>
      <h1>Extracted Materials</h1>
      <div class="sync"><span id="dbinfo"></span><button class="linkbtn" id="syncBtn">Sync now</button></div>
    </div>
    <div class="head-right">
      <button class="btn-dark" id="againBtn" hidden>Upload another estimate</button>
      <button class="btn-white" id="printBtn" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print PDF
      </button>
    </div>
  </header>

  <div id="drop">
    <strong>Drop the estimate Excel here, or click to browse</strong>
    <p>.xlsx / .xls &mdash; processed inside your browser. Nothing is uploaded, saved, or written to any sheet.</p>
    <input id="file" type="file" accept=".xlsx,.xls,.xlsm" hidden>
  </div>
  <div id="status"></div>
  <div id="result"></div>
  <input id="imgPick" type="file" accept="image/*" hidden>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="settings.js"></script>
<script src="config.js"></script>
<script src="extractor.js"></script>
<script src="sheet.js"></script>
<script src="app.js"></script>
</body>
</html>
