<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faboolux Materials Extractor</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#1f2430; --muted:#6b7280; --brand:#1967d2; --line:#d9dde7; --red:#d93025; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { margin:0; font-size:18px; }
  main { max-width:1100px; margin:24px auto; padding:0 16px; }
  #drop { background:var(--card); border:2px dashed var(--line); border-radius:12px; padding:40px 20px; text-align:center; cursor:pointer; transition:.15s; }
  #drop.over, #drop:hover { border-color:var(--brand); background:#eef4ff; }
  #drop p { margin:6px 0; color:var(--muted); }
  #drop strong { color:var(--ink); font-size:16px; }
  #status { margin:16px 0; font-size:14px; min-height:20px; }
  #status.err { color:var(--red); font-weight:600; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:12px; }
  .toolbar h2 { margin:0; font-size:16px; flex:1; }
  button { background:var(--brand); color:#fff; border:0; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:13px; }
  button.secondary { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  .room { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:18px; overflow:hidden; }
  .room h3 { margin:0; padding:10px 14px; background:#e8f0fe; color:#1967d2; font-size:15px; }
  table { width:100%; border-collapse:collapse; }
  th { background:#f3f3f3; font-size:13px; }
  th, td { border:1px solid var(--line); padding:8px; text-align:center; vertical-align:middle; font-size:13px; }
  td.finish { white-space:pre-line; width:150px; }
  td.img { width:100px; }
  td.img img { width:84px; height:84px; object-fit:cover; border-radius:6px; display:block; margin:auto; }
  .fill { background:var(--red); color:#fff; font-weight:700; }
</style>
</head>
<body>
<header>
  <h1>Faboolux Materials Extractor</h1>
  <span style="display:flex;gap:10px;align-items:center">
    <span id="dbinfo" style="font-size:12px;color:var(--muted)"></span>
    <button class="secondary" onclick="syncNow()">Sync now</button>
  </span>
</header>
<main>
  <div id="drop">
    <strong>Drop the estimate Excel here, or click to browse</strong>
    <p>.xlsx / .xls &mdash; processed in memory, nothing is saved or written to any sheet</p>
    <input id="file" type="file" accept=".xlsx,.xls,.xlsm" hidden>
  </div>
  <div id="status"></div>
  <div id="result"></div>
</main>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
let lastData = null;

const dbInfo = document.getElementById('dbinfo');
let syncInfo = null;

function showSync(j) {
  syncInfo = j;
  paintSync();
}
function paintSync() {
  if (!syncInfo) return;
  if (!syncInfo.ok) { dbInfo.textContent = 'Database not loaded' + (syncInfo.error ? ': ' + syncInfo.error : ''); dbInfo.style.color = 'var(--red)'; return; }
  const ago = Math.max(0, Math.round((Date.now() - syncInfo.lastCheck) / 1000));
  dbInfo.style.color = syncInfo.error ? 'var(--red)' : 'var(--muted)';
  dbInfo.textContent = `Sheet synced ${ago}s ago · ${syncInfo.laminates} laminates` + (syncInfo.error ? ' · last sync failed' : '');
}
function loadSync() { return fetch('/api/health').then(r => r.json()).then(showSync).catch(() => {}); }
function syncNow() {
  dbInfo.textContent = 'Syncing…';
  return fetch('/api/refresh', { method: 'POST' }).then(r => r.json()).then(showSync).catch(() => {});
}
loadSync();
setInterval(loadSync, 10000);
setInterval(paintSync, 1000);

drop.addEventListener('click', () => fileInput.click());
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) upload(fileInput.files[0]); fileInput.value = ''; });

async function upload(file) {
  setStatus('Extracting…');
  resultEl.innerHTML = '';
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch('/api/extract', { method: 'POST', body: fd });
    const j = await r.json();
    if (j.status !== 'success') throw new Error(j.message);
    lastData = j;
    setStatus(`Done in ${j.ms} ms`);
    render(j);
  } catch (e) {
    setStatus(e.message, true);
  }
}

function setStatus(msg, err) { statusEl.textContent = msg; statusEl.className = err ? 'err' : ''; }

function finishCells(f) {
  const text = f.lines.join('\n');
  const isFill = /fill manually/i.test(text);
  const img = f.image ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(f.image)}" alt="">` : '';
  return `<td class="finish${isFill ? ' fill' : ''}">${esc(text)}</td><td class="img">${img}</td>`;
}

function render(j) {
  const toolbar = `<div class="toolbar"><h2>${esc(j.projectName)}</h2>
    <button class="secondary" onclick="copyTable()">Copy as table</button></div>`;
  const rooms = j.rooms.map(room => `
    <div class="room"><h3>${esc(room.name)}</h3>
    <table>
      <tr><th>Product</th><th>Carcass Material</th><th>Shutter Material</th><th colspan="2">Carcass Finish</th><th colspan="2">Shutter Finish</th></tr>
      ${room.rows.map(r => `<tr>
        <td>${esc(r.product)}</td><td>${esc(r.carcassMaterial)}</td><td>${esc(r.shutterMaterial)}</td>
        ${finishCells(r.carcass)}${finishCells(r.shutter)}
      </tr>`).join('')}
    </table></div>`).join('');
  resultEl.innerHTML = toolbar + (rooms || '<p>No materials found.</p>');
}

function copyTable() {
  if (!lastData) return;
  const lines = [];
  lastData.rooms.forEach(room => {
    lines.push(room.name);
    lines.push(['Product','Carcass Material','Shutter Material','Carcass Finish','Shutter Finish'].join('\t'));
    room.rows.forEach(r => lines.push([r.product, r.carcassMaterial, r.shutterMaterial,
      '"' + r.carcass.lines.join('\n') + '"', '"' + r.shutter.lines.join('\n') + '"'].join('\t')));
    lines.push('');
  });
  navigator.clipboard.writeText(lines.join('\n')).then(() => setStatus('Copied to clipboard'));
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
